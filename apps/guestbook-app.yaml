apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child-guestbook-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ismaililica/argocd-example-apps.git
    targetRevision: master
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true                            
